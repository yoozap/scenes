# How the pod serves the built scene.
#
# nginx's stock config already does the two things that matter most here: it
# sends an ETag for every static file, so a returning visitor revalidates and
# gets 304 with an empty body rather than re-downloading the models, and the
# platform's edge applies brotli to the text types on the way out (the 1 MB
# three.js chunk leaves as ~290 kB). What it does NOT send is any
# Cache-Control at all, so every asset costs a conditional request on every
# load: seven round-trips before a single byte of scenery moves, which on a
# phone over mobile latency is most of a second doing nothing.
#
# So the rules below are about ROUND-TRIPS, not bytes.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NO bare `types` block here, and this is the whole lesson: a types block
    # in a server context REPLACES the inherited map rather than extending it.
    # Declaring three types to name .glb properly therefore unmapped every
    # other extension, .html included, so index.html fell through to
    # default_type application/octet-stream and both pods served the page as
    # a DOWNLOAD instead of rendering it. Serving the models as
    # octet-stream — which is what the stock config does — costs nothing;
    # unmapping text/html costs the entire site.
    #
    # If .glb ever needs its real type, add it per-location with
    # `location ~ \.glb$ { default_type model/gltf-binary; }`, which touches
    # nothing else, or re-include mime.types INSIDE the types block.

    # Vite fingerprints everything under /assets (scene2-DPV0Apxc.js), so the
    # name IS the version: a changed file is a changed URL and can never be
    # served stale. immutable tells the browser not even to revalidate.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # The models are NOT fingerprinted — city.glb keeps its name across
    # builds — so immutable would strand a stale model in every browser that
    # had ever loaded the page. A week of silent reuse plus a day of
    # stale-while-revalidate gets the repeat visit its 9.4 MB from disk with
    # no request at all, while still picking a new model up within a day of
    # it shipping. The ETag remains the backstop.
    location /models/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    # The page itself names the fingerprinted bundles, so it is the one file
    # that must never be cached — a stale index.html points at assets that no
    # longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
