<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yoozap — Scene 1: Tunnel Run</title>
  <meta name="description" content="Porsche Taycan at a locked 300 km/h through a scanned railway tunnel. Three.js / WebGPU." />
  <style>
    :root {
      --bg: #03070c;
      --paper: #0c1a22;
      --primary: #2a9d8f;
      --primary-soft: rgba(42, 157, 143, 0.12);
      --divider: rgba(255, 255, 255, 0.14);
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden; /* the scene is the page — nothing scrolls past it */
      background-color: var(--bg);
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* city.js measures #hero to drive its scroll fade. Here the scene IS the
       page, so the hero is simply the viewport and the fade stays at 1. It
       paints ABOVE the fixed canvas, so it must let the pointer fall through
       to the scene (drag orbit, zoom) — the camera bar re-enables its own. */
    #hero {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #city-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      touch-action: none; /* fingers drive the scene, not Safari's scroll/zoom */
    }

    html.has-city #city-canvas { display: block; }
    #city-canvas.is-ready { opacity: 1; }

    /* ---------- camera bar ---------- */

    .scenes {
      position: fixed;
      z-index: 2;
      top: 16px;
      left: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.6s ease 0.3s;
      pointer-events: none;
    }

    html.has-city .scenes {
      opacity: 1;
      pointer-events: auto;
    }

    .scenes a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 14px;
      background: none;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Cascadia Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      color: rgba(255, 255, 255, 0.72);
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .scenes a:hover {
      color: #fff;
    }

    .scenes a.is-active {
      color: var(--primary);
    }

    .scenes__num {
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      opacity: 0.55;
    }

    .scenes a:focus-visible {
      outline: 2px solid rgba(42, 157, 143, 0.8);
      outline-offset: 2px;
    }

    /* phones: the bar tightens — smaller type, closer links — so all five
       edits sit in one quiet row over the scene */
    @media (max-width: 640px) {
      .scenes { top: 10px; left: 10px; gap: 0; }
      .scenes a { height: 30px; padding: 0 8px; gap: 5px; font-size: 11px; }
      .scenes__num { font-size: 9px; }
    }

    /* ---------- loading ---------- */

    .loading {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-content: center;
      gap: 14px;
      justify-items: center;
      background-color: var(--bg);
      color: var(--primary);
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Cascadia Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      transition: opacity 0.9s ease, visibility 0s 0.9s;
    }

    /* scene-live, not has-city: the render loop adds it once frames actually
       present, so the fade is seen instead of being eaten by the pipeline
       compilation stall on the first frames */
    html.scene-live .loading {
      opacity: 0;
      visibility: hidden;
    }

    .loading__pct {
      font-size: 12px;
      opacity: 0.7;
      font-variant-numeric: tabular-nums; /* the digits tick without jitter */
    }

    .loading__bar {
      width: 140px;
      height: 2px;
      border-radius: 2px;
      background-color: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .loading__bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background-color: var(--primary);
      animation: sweep 1.1s ease-in-out infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading__bar::after { animation: none; width: 100%; }
      #city-canvas, .scenes { transition: none; }
    }

    .failed {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: none;
      place-content: center;
      padding: 32px;
      text-align: center;
      background-color: var(--bg);
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      line-height: 1.6;
    }

    html.scene-failed .failed { display: grid; }
    html.scene-failed .loading { display: none; }
  </style>
</head>
<body>

  <canvas id="city-canvas" aria-hidden="true"></canvas>

  <div id="hero">
    <nav class="scenes" aria-label="Camera sequences">
      <a href="#scene-1" data-scene="1" aria-pressed="false"><span class="scenes__num">01</span> Hero Run</a>
      <a href="#scene-2" data-scene="2" aria-pressed="false"><span class="scenes__num">02</span> Pursuit</a>
      <a href="#scene-3" data-scene="3" aria-pressed="false"><span class="scenes__num">03</span> Drift</a>
      <a href="#scene-4" data-scene="4" aria-pressed="false"><span class="scenes__num">04</span> IMAX</a>
      <a href="#scene-5" data-scene="5" aria-pressed="false"><span class="scenes__num">05</span> Snap Cuts</a>
    </nav>
  </div>

  <div class="loading">
    <div class="loading__bar"></div>
    Loading scene
    <span class="loading__pct">[0%]</span>
  </div>

  <div class="failed">
    <p>
      This scene needs WebGPU or WebGL2.<br />
      Try the latest Chrome, Edge or Safari.
    </p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
