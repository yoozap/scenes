<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoozap — Scene 1: Tunnel Run</title>
  <meta name="description" content="Porsche Taycan at a locked 300 km/h through a scanned railway tunnel. Three.js / WebGPU." />
  <style>
    :root {
      --bg: #03070c;
      --paper: #0c1a22;
      --primary: #2a9d8f;
      --primary-soft: rgba(42, 157, 143, 0.12);
      --divider: rgba(255, 255, 255, 0.14);
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden; /* the scene is the page — nothing scrolls past it */
      background-color: var(--bg);
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* city.js measures #hero to drive its scroll fade. Here the scene IS the
       page, so the hero is simply the viewport and the fade stays at 1. */
    #hero {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #city-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    html.has-city #city-canvas { display: block; }
    #city-canvas.is-ready { opacity: 1; }

    /* ---------- camera bar ---------- */

    .scenes {
      position: fixed;
      z-index: 2;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 14px;
      background-color: rgba(12, 26, 34, 0.72);
      border: 1px solid var(--divider);
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: opacity 0.6s ease 0.3s;
      pointer-events: none;
    }

    html.has-city .scenes {
      opacity: 1;
      pointer-events: auto;
    }

    .scenes button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: none;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      color: rgba(255, 255, 255, 0.72);
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .scenes button:hover {
      background-color: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .scenes button.is-active {
      background-color: var(--primary-soft);
      border-color: rgba(42, 157, 143, 0.55);
      color: var(--primary);
    }

    .scenes__num {
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      opacity: 0.55;
    }

    .scenes button:focus-visible {
      outline: 2px solid rgba(42, 157, 143, 0.8);
      outline-offset: 2px;
    }

    /* ---------- hint + loading ---------- */

    .hint {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.4);
      opacity: 0;
      transition: opacity 0.6s ease 0.6s;
      pointer-events: none;
    }

    html.has-city .hint { opacity: 1; }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-content: center;
      gap: 14px;
      justify-items: center;
      background-color: var(--bg);
      color: rgba(255, 255, 255, 0.55);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: opacity 0.6s ease, visibility 0s 0.6s;
    }

    html.has-city .loading {
      opacity: 0;
      visibility: hidden;
    }

    .loading__bar {
      width: 140px;
      height: 2px;
      border-radius: 2px;
      background-color: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .loading__bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background-color: var(--primary);
      animation: sweep 1.1s ease-in-out infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading__bar::after { animation: none; width: 100%; }
      #city-canvas, .scenes, .hint { transition: none; }
    }

    .failed {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: none;
      place-content: center;
      padding: 32px;
      text-align: center;
      background-color: var(--bg);
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      line-height: 1.6;
    }

    html.scene-failed .failed { display: grid; }
    html.scene-failed .loading { display: none; }
  </style>
</head>
<body>

  <canvas id="city-canvas" aria-hidden="true"></canvas>

  <div id="hero">
    <nav class="scenes" aria-label="Camera sequences">
      <button type="button" data-scene="1" aria-pressed="false"><span class="scenes__num">01</span> Hero Run</button>
      <button type="button" data-scene="2" aria-pressed="false"><span class="scenes__num">02</span> Pursuit</button>
      <button type="button" data-scene="3" aria-pressed="false"><span class="scenes__num">03</span> Drift</button>
      <button type="button" data-scene="4" aria-pressed="false"><span class="scenes__num">04</span> IMAX</button>
      <button type="button" data-scene="5" aria-pressed="false"><span class="scenes__num">05</span> Snap Cuts</button>
    </nav>

    <p class="hint">Drag to orbit &middot; scroll to zoom &middot; E to drive &middot; Esc to leave the tunnel</p>
  </div>

  <div class="loading">
    <div class="loading__bar"></div>
    Loading scene
  </div>

  <div class="failed">
    <p>
      This scene needs WebGPU or WebGL2 and a desktop GPU.<br />
      Try the latest Chrome, Edge or Safari.
    </p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
